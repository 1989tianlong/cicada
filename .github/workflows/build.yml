name: build

# macOS runner minutes are billed at 10× for private repositories, so this runs on
# pull requests and on demand rather than on every push to main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-agents.py
      - run: swift build
      - run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Cicada
          path: |
            build/Cicada-*.dmg
            build/Cicada-*.zip
            build/checksums.txt
