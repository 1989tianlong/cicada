# xcodegen spec for a device-installable iOS project (generated by scripts/make-device-project.sh
# into build/device/ — never committed, the repo builds with scripts instead of .xcodeproj).
# Open build/device/Cicada.xcodeproj in Xcode, pick your iPhone, press Run: automatic signing
# handles the provisioning profile with your Apple ID (a free one works for 7 days).
name: Cicada
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5"
    DEVELOPMENT_TEAM: D2QH97HAAL
    CODE_SIGN_STYLE: Automatic
    OTHER_SWIFT_FLAGS: "$(inherited) -D CICADA_IOS"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Cicada:
    type: application
    platform: iOS
    sources:
      # The same shared Mac engine files as ios/scripts/build.sh (ios/shared-sources.txt).
      - Sources/Cicada/Ling.swift
      - Sources/Cicada/AIProviders.swift
      - Sources/Cicada/AICheck.swift
      - Sources/Cicada/Notes.swift
      - Sources/Cicada/HeardText.swift
      - Sources/Cicada/MeetingEnd.swift
      - Sources/Cicada/Localization.swift
      - Sources/Cicada/Voices.swift
      - Sources/Cicada/SessionStore.swift
      - Sources/Cicada/Correction.swift
      - Sources/Cicada/Vocabulary.swift
      - Sources/Cicada/LiveFixes.swift
      - Sources/Cicada/SpeakerID.swift
      - Sources/Cicada/AudioFiles.swift
      - Sources/Cicada/Translator.swift
      - Sources/Cicada/Diagnostics.swift
      - Sources/Cicada/RecordList.swift
      - Sources/Cicada/Languages.swift
      - Sources/Cicada/Recognition.swift
      - Sources/Cicada/CloudHearing.swift
      - Sources/Cicada/SoundKind.swift
      - ios/Sources/Cicada
    resources:
      - build/device/Resources
    settings:
      base:
        INFOPLIST_FILE: plists/App-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.1989tianlong.cicada
    dependencies:
      - target: CicadaLive
        embed: true
  CicadaLive:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/LiveActivity
        excludes:
          - "Info.plist"
      - ios/Sources/Cicada/ListenActivity.swift
    settings:
      base:
        INFOPLIST_FILE: plists/Live-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.1989tianlong.cicada.live
        OTHER_SWIFT_FLAGS: "$(inherited) -D CICADA_IOS -application-extension"
        # The extension is entered through _NSExtensionMain instead of @main (see
        # ios/scripts/build.sh): run the @main WidgetBundle on the main queue.
        OTHER_LDFLAGS: "$(inherited) -e _NSExtensionMain"
        SKIP_INSTALL: YES
